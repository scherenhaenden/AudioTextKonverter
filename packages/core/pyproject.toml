[tool.poetry]
name = "magnetaraion-core"
version = "0.1.0"
description = "Core functionality for MagnetarAion"
authors = ["Jules <agent@example.com>"]
packages = [{include = "core", from = "src"}]

[tool.poetry.dependencies]
python = "^3.9"
sqlalchemy = "^2.0.23"
psycopg2-binary = "^2.9.9"
python-dotenv = "^1.0.0"
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
pydantic = "^2.5.3"
bcrypt = "^4.1.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
